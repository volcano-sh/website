[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."ask-ai"]
  included_files = ["netlify/functions/ask-ai/docs-index.json"]

[dev]
  command = "npm run start"
  targetPort = 3000
  port = 8888
  autoLaunch = false
