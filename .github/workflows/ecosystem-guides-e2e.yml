name: Ecosystem guides e2e

on:
  pull_request:
    branches: [master]
    paths:
      - "docs/Ecosystem/GroveOnVolcano.md"
      - "docs/Ecosystem/LeaderWorkerSetOnVolcano.md"
      - "docs/Ecosystem/RayOnVolcano.md"
      - "test/e2e/**"
      - "test/helpers.mjs"
      - ".github/workflows/ecosystem-guides-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecosystem-guides-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guide:
    name: ${{ matrix.plan }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        plan: [grove-fresh, grove-existing, lws-fresh, lws-existing, kuberay-raycluster, kuberay-rayjob, kuberay-topology, kuberay-existing]
    env:
      VOLCANO_VERSION: v1.16.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Free disk space for the Ray image
        if: startsWith(matrix.plan, 'kuberay-')
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.19.0
      - name: Create kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          kubectl_version: v1.37.1
          cluster_name: guides
          config: test/e2e/kind.yaml
          wait: 120s
      - name: Install Volcano
        run: |
          kubectl apply --server-side -f "https://raw.githubusercontent.com/volcano-sh/volcano/${VOLCANO_VERSION}/installer/volcano-development.yaml"
          kubectl -n volcano-system wait --for=condition=Available deployment --all --timeout=300s
      - name: Run the guide
        run: node test/e2e/run-guide.mjs "${{ matrix.plan }}"
      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p e2e-logs
          kubectl get all,podgroups.scheduling.volcano.sh -A -o wide > e2e-logs/resources.txt 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > e2e-logs/events.txt 2>&1 || true
          kind export logs e2e-logs/kind --name guides || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-logs-${{ matrix.plan }}
          path: e2e-logs
