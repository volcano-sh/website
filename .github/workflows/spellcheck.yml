name: Spell check

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "blog/**"
      - "README.md"
      - "cspell.json"
      - ".cspell/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/spellcheck.yml"
  pull_request:
    branches: [master]
    paths:
      - "docs/**"
      - "blog/**"
      - "README.md"
      - "cspell.json"
      - ".cspell/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/spellcheck.yml"

jobs:
  spellcheck:
    name: Check docs spelling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run spell check
        run: npm run spellcheck
